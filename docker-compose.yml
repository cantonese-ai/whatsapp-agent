# WhatsApp voice-note transcription agent: wwebjs-api (WhatsApp Web in headless Chromium)
# + voice-transcriber (queues voice notes, transcribes them with cantonese.ai, replies).
#
#   cp .env.example .env    # then set WWEBJS_API_KEY (openssl rand -hex 32) and
#                           # CANTONESE_AI_OAUTH_CLIENT_SECRET (given to you by the setup bot)
#   docker compose run --rm -p 127.0.0.1:53682:53682 -e CANTONESE_AI_OAUTH_CALLBACK_BIND=0.0.0.0 \
#     voice-transcriber python app.py login --no-browser    # or set CANTONESE_AI_API_KEY instead
#   docker compose up -d
#
# The login prints a cantonese.ai sign-in URL: open it in a browser on this machine and sign in.
# cantonese.ai then sends the browser to http://127.0.0.1:53682/callback (the only registered
# redirect URI), which the -p flag forwards into the container; its listener has to bind 0.0.0.0
# for that, hence the -e flag. Port 53682 is published only for this one-off login run.
#
# Both ports are bound to 127.0.0.1 only: whoever reaches wwebjs-api can read and send
# messages as your WhatsApp number. Do not publish them to the internet.
name: whatsapp-agent

services:
  wwebjs-api:
    # Keep this tag in step with wwebjs-api/sessions.js (a patched copy of this version's file).
    image: avoylenko/wwebjs-api:v1.34.7-hotfix2
    restart: unless-stopped
    # Explicit DNS: on hosts whose resolver containers cannot reach (systemd-resolved 127.0.0.53, VPNs) Chromium
    # cannot resolve web.whatsapp.com and no QR code ever appears. Override in .env on networks that block public DNS.
    dns:
      - ${DNS_SERVER_1:-1.1.1.1}
      - ${DNS_SERVER_2:-8.8.8.8}
    environment:
      PORT: "3000"
      API_KEY: ${WWEBJS_API_KEY:?set WWEBJS_API_KEY in .env (openssl rand -hex 32)}
      SESSIONS_PATH: /usr/src/app/sessions
      ENABLE_WEB_UI: ${WWEBJS_ENABLE_WEB_UI:-TRUE}
      ENABLE_SWAGGER_ENDPOINT: ${WWEBJS_ENABLE_SWAGGER:-TRUE}
      # Voice notes go to voice-transcriber, which only needs "media" (plus the patch's
      # session_paired / session_removed events, which are always sent).
      ENABLE_WEBHOOK: "TRUE"
      BASE_WEBHOOK_URL: http://voice-transcriber:8080/webhook
      DISABLED_CALLBACKS: "auth_failure|authenticated|call|change_state|disconnected|group_join|group_leave|group_update|loading_screen|media_uploaded|message_ack|message_create|message_reaction|message_revoke_everyone|qr|ready|contact_changed|unread_count|message_edit|message_ciphertext"
      ENABLE_LOCAL_CALLBACK_EXAMPLE: "FALSE"
      ENABLE_WEBSOCKET: "FALSE"
      # A personal number: do not mark incoming chats as read.
      SET_MESSAGES_AS_SEEN: ${SET_MESSAGES_AS_SEEN:-FALSE}
      AUTO_START_SESSIONS: "TRUE"
      RECOVER_SESSIONS: "TRUE"
      HEADLESS: "TRUE"
      LOG_LEVEL: ${WWEBJS_LOG_LEVEL:-info}
      # Catch-up after a restart re-sends voice notes at most this old.
      CATCHUP_MAX_SECONDS: ${CATCHUP_MAX_SECONDS:-3600}
      # Re-scan recent chats for voice notes WhatsApp delayed to the linked device.
      CATCHUP_INTERVAL_SECONDS: ${CATCHUP_INTERVAL_SECONDS:-120}
      CATCHUP_LOOKBACK_SECONDS: ${CATCHUP_LOOKBACK_SECONDS:-1800}
      # Short aggressive scan for brand-new chats (in addition to the 2m/30m scan).
      CATCHUP_RECENT_INTERVAL_SECONDS: ${CATCHUP_RECENT_INTERVAL_SECONDS:-20}
      CATCHUP_RECENT_LOOKBACK_SECONDS: ${CATCHUP_RECENT_LOOKBACK_SECONDS:-300}
    volumes:
      - wwebjs-sessions:/usr/src/app/sessions
      - ./wwebjs-api/sessions.js:/usr/src/app/src/sessions.js:ro
    # Chromium crashes with Docker's default 64 MB /dev/shm.
    shm_size: 512mb
    ports:
      - "127.0.0.1:${WWEBJS_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/ping', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  voice-transcriber:
    image: python:3.12-slim
    restart: unless-stopped
    # Explicit DNS: on hosts whose resolver containers cannot reach (systemd-resolved 127.0.0.53, VPNs) Chromium
    # cannot resolve web.whatsapp.com and no QR code ever appears. Override in .env on networks that block public DNS.
    dns:
      - ${DNS_SERVER_1:-1.1.1.1}
      - ${DNS_SERVER_2:-8.8.8.8}
    working_dir: /app
    command: ["python", "-u", "app.py"]
    # Every variable in .env (see .env.example) is passed through.
    env_file: .env
    environment:
      WWEBJS_URL: http://wwebjs-api:3000
      DB_PATH: /data/queue.db
      CANTONESE_AI_TOKEN_PATH: /data/cantonese-ai-token.json
      # "Sign in with cantonese.ai" client (secret from .env; needed for login and token refresh).
      CANTONESE_AI_OAUTH_CLIENT_ID: ${CANTONESE_AI_OAUTH_CLIENT_ID:-whatsapp-agent}
      CANTONESE_AI_OAUTH_CLIENT_SECRET: ${CANTONESE_AI_OAUTH_CLIENT_SECRET:-}
      CANTONESE_AI_OAUTH_CALLBACK_PORT: ${CANTONESE_AI_OAUTH_CALLBACK_PORT:-53682}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./voice-transcriber:/app:ro
      - transcriber-data:/data
    ports:
      - "127.0.0.1:${TRANSCRIBER_PORT:-8080}:8080"
    # Lets in-flight jobs finish one STT attempt (150 s) and reply after `docker compose stop`.
    stop_grace_period: 300s
    depends_on:
      - wwebjs-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  wwebjs-sessions:   # the WhatsApp linked-device login: treat like a password
  transcriber-data:  # SQLite queue + cantonese.ai sign-in token
